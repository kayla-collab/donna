<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       DONNA ROGGIO LLC - NAVIGATION SIDEBAR v2.0
       Clean sidebar navigation (no hamburger)
       ═══════════════════════════════════════════════════════════════════ */
    
    :root {
      --nav-primary: #ab9478;
      --nav-dark: #8a7760;
      --nav-darkest: #6d5f4c;
      --nav-light: #d4c9bb;
      --nav-lightest: #f8f6f3;
      --nav-accent: #3E5C65;
      --nav-white: #ffffff;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--nav-white);
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* ═══════════════════════════════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════════════════════════════ */
    .nav-header {
      background: linear-gradient(135deg, var(--nav-primary) 0%, var(--nav-dark) 100%);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    
    .nav-logo {
      width: 36px;
      height: 36px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    
    .nav-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 16px;
      font-weight: 600;
    }
    
    .nav-subtitle {
      font-size: 10px;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* ═══════════════════════════════════════════════════════════════════
       CONTENT - Scrollable
       ═══════════════════════════════════════════════════════════════════ */
    .nav-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    
    /* ═══════════════════════════════════════════════════════════════════
       SECTIONS - Collapsible
       ═══════════════════════════════════════════════════════════════════ */
    .nav-section {
      border-bottom: 1px solid #eee;
    }
    
    .nav-section:last-child {
      border-bottom: none;
    }
    
    .nav-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
    }
    
    .nav-section-header:hover {
      background: var(--nav-lightest);
    }
    
    .nav-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--nav-darkest);
    }
    
    .nav-section-icon {
      font-size: 14px;
    }
    
    .nav-section-arrow {
      font-size: 10px;
      color: #999;
      transition: transform 0.2s;
    }
    
    .nav-section.expanded .nav-section-arrow {
      transform: rotate(180deg);
    }
    
    .nav-section-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background: #fafafa;
    }
    
    .nav-section.expanded .nav-section-content {
      max-height: 800px;
    }
    
    /* ═══════════════════════════════════════════════════════════════════
       NAV ITEMS
       ═══════════════════════════════════════════════════════════════════ */
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 10px 36px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      border-left: 3px solid transparent;
    }
    
    .nav-item:hover {
      background: var(--nav-light);
      color: var(--nav-darkest);
      border-left-color: var(--nav-primary);
    }
    
    .nav-item-text {
      flex: 1;
    }
    
    .nav-item-external {
      color: #999;
      font-size: 10px;
    }
    
    .nav-item.placeholder {
      color: #aaa;
      font-style: italic;
    }
    
    .nav-item.placeholder::after {
      content: 'Soon';
      font-size: 8px;
      background: #eee;
      padding: 2px 5px;
      border-radius: 3px;
      margin-left: 6px;
      font-style: normal;
    }
    
    /* Account items with categorize button */
    .nav-account-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 8px 36px;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }
    
    .nav-account-item:hover {
      background: var(--nav-light);
      border-left-color: var(--nav-primary);
    }
    
    .nav-account-name {
      font-size: 12px;
      color: #555;
      cursor: pointer;
      flex: 1;
    }
    
    .nav-account-name:hover {
      color: var(--nav-darkest);
    }
    
    .nav-account-btn {
      background: var(--nav-accent);
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .nav-account-btn:hover {
      background: #2d4a52;
    }
    
    /* ═══════════════════════════════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════════════════════════════ */
    .nav-footer {
      padding: 12px 16px;
      background: var(--nav-lightest);
      border-top: 1px solid #eee;
      flex-shrink: 0;
      text-align: center;
    }
    
    .nav-footer-brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 11px;
      color: var(--nav-dark);
    }
    
    .nav-footer-link {
      display: block;
      margin-top: 4px;
      font-size: 9px;
      color: var(--nav-primary);
      text-decoration: none;
    }
    
    .nav-footer-link:hover {
      text-decoration: underline;
    }
    
    /* ═══════════════════════════════════════════════════════════════════
       LOADING
       ═══════════════════════════════════════════════════════════════════ */
    .nav-loading {
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 11px;
    }
    
    .nav-loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--nav-lightest);
      border-top-color: var(--nav-primary);
      border-radius: 50%;
      animation: nav-spin 1s linear infinite;
      margin: 0 auto 8px;
    }
    
    @keyframes nav-spin {
      to { transform: rotate(360deg); }
    }
    
    /* ═══════════════════════════════════════════════════════════════════
       FULL-PAGE LOADING OVERLAY (for opening modals)
       ═══════════════════════════════════════════════════════════════════ */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(248, 246, 243, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, visibility 0.15s ease;
    }
    
    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .loading-overlay-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--nav-light);
      border-top-color: var(--nav-primary);
      border-radius: 50%;
      animation: nav-spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    
    .loading-overlay-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 16px;
      color: var(--nav-darkest);
      margin-bottom: 6px;
    }
    
    .loading-overlay-subtitle {
      font-size: 12px;
      color: var(--nav-dark);
    }
    
    /* Button loading state */
    .nav-account-btn.loading {
      background: var(--nav-dark);
      pointer-events: none;
      position: relative;
    }
    
    .nav-account-btn.loading::after {
      content: '';
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: nav-spin 0.6s linear infinite;
      display: inline-block;
      margin-left: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="nav-header">
    <div class="nav-logo">💰</div>
    <div>
      <div class="nav-title">Money Mastery</div>
      <div class="nav-subtitle">Navigation</div>
    </div>
  </div>
  
  <!-- Scrollable Content -->
  <div class="nav-content" id="navContent">
    <div class="nav-loading" id="navLoading">
      <div class="nav-loading-spinner"></div>
      Loading...
    </div>
  </div>
  
  <!-- Footer -->
  <div class="nav-footer">
    <div class="nav-footer-brand">Donna Roggio LLC</div>
    <a href="https://www.risingandthriving.com" target="_blank" class="nav-footer-link">
      risingandthriving.com
    </a>
  </div>
  
  <!-- Loading Overlay (shown when opening modals) -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-overlay-spinner"></div>
    <div class="loading-overlay-title" id="loadingTitle">Opening...</div>
    <div class="loading-overlay-subtitle" id="loadingSubtitle">Please wait</div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════════
    let navState = {
      accounts: [],
      expandedSections: ['accounts', 'clarity'],
      currentMonth: new Date().getMonth()
    };
    
    // Money Reset Call links by month (0-indexed, Feb=1 through Dec=11)
    const MONEY_RESET_LINKS = {
      1: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-02-02-12-00/form',
      2: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-03-02-12-00/form',
      3: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-04-06-12-00/form',
      4: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-05-04-12-00/form',
      5: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-06-08-12-00/form',
      6: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-07-06-12-00/form',
      7: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-08-03-12-00/form',
      8: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-09-07-12-00/form',
      9: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-10-05-12-00/form',
      10: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-11-02-12-00/form',
      11: 'https://www.risingandthriving.com/event-details/monthly-money-reset-calls-2026-12-07-12-00/form'
    };
    
    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 
                         'July', 'August', 'September', 'October', 'November', 'December'];
    
    // ═══════════════════════════════════════════════════════════════════
    // LOAD ACCOUNTS
    // ═══════════════════════════════════════════════════════════════════
    function loadAccounts() {
      google.script.run
        .withSuccessHandler(function(accounts) {
          // accounts is [{tabName, displayName}] or a plain string array (legacy)
          navState.accounts = (accounts || []).map(function(a) {
            if (typeof a === 'string') return { tabName: a, displayName: a };
            return a;
          });
          renderNavigation();
        })
        .withFailureHandler(function(error) {
          console.error('Failed to load accounts:', error);
          navState.accounts = [];
          renderNavigation();
        })
        .getAccountNamesForNav();
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════════════════════
    function renderNavigation() {
      const content = document.getElementById('navContent');
      const currentMonthLink = MONEY_RESET_LINKS[navState.currentMonth];
      const nextMonth = (navState.currentMonth + 1) % 12;
      const nextMonthLink = MONEY_RESET_LINKS[nextMonth];
      
      let html = '';
      
      // MY ACCOUNTS
      html += buildSection('accounts', '📊', 'My Accounts', `
        ${navState.accounts.length > 0 ? navState.accounts.map(acc => {
          const tabName = (acc.tabName || acc).replace(/'/g, "\\'");
          const displayName = (acc.displayName || acc.tabName || acc);
          return `
          <div class="nav-account-item">
            <span class="nav-account-name" onclick="navigateToSheet('${tabName}')" title="${displayName}">${displayName}</span>
            <button class="nav-account-btn" onclick="openCategorization('${tabName}', this)">Categorize</button>
          </div>
          `;
        }).join('') : '<div class="nav-item placeholder">No accounts found</div>'}
      `);
      // eslint-disable-next-line no-unused-expressions
      
      // CLARITY & REPORTS
      html += buildSection('clarity', '📈', 'Clarity & Reports', `
        <div class="nav-item" onclick="navigateToSheet('DASHBOARD')">
          <span class="nav-item-text">Dashboard</span>
        </div>
        <div class="nav-item" onclick="navigateToSheet('REPORTS')">
          <span class="nav-item-text">Clarity Reports</span>
        </div>
        <div class="nav-item" onclick="navigateToSheet('INCOME LABELS')">
          <span class="nav-item-text">Income Labels</span>
        </div>
        <div class="nav-item" onclick="navigateToSheet('EXPENSE LABELS')">
          <span class="nav-item-text">Expense Labels</span>
        </div>
      `);
      
      // PROFILE & MANAGEMENT
      html += buildSection('profile', '👤', 'Profile & Management', `
        <a class="nav-item" href="https://www.risingandthriving.com/profile/my/profile" target="_blank">
          <span class="nav-item-text">My Profile</span>
          <span class="nav-item-external">↗</span>
        </a>
        <a class="nav-item" href="https://www.risingandthriving.com/my-subscriptions" target="_blank">
          <span class="nav-item-text">Manage Subscriptions</span>
          <span class="nav-item-external">↗</span>
        </a>
        <a class="nav-item" href="https://www.risingandthriving.com/my-bookings" target="_blank">
          <span class="nav-item-text">Manage Bookings</span>
          <span class="nav-item-external">↗</span>
        </a>
      `);
      
      // MONEY RESET CALLS
      html += buildSection('reset', '📅', 'Money Reset Calls', `
        ${currentMonthLink ? `
          <a class="nav-item" href="${currentMonthLink}" target="_blank">
            <span class="nav-item-text">${MONTH_NAMES[navState.currentMonth]} Call</span>
            <span class="nav-item-external">↗</span>
          </a>
        ` : ''}
        ${nextMonthLink ? `
          <a class="nav-item" href="${nextMonthLink}" target="_blank">
            <span class="nav-item-text">${MONTH_NAMES[nextMonth]} Call</span>
            <span class="nav-item-external">↗</span>
          </a>
        ` : ''}
        <div class="nav-item" style="font-size: 10px; color: #888; cursor: default;">
          <span class="nav-item-text">1st Monday each month</span>
        </div>
      `);
      
      // FIERCE FINANCIALS
      html += buildSection('fierce', '💎', 'Fierce Financials', `
        <a class="nav-item" href="https://wix.to/2YxHuTl" target="_blank">
          <span class="nav-item-text">Book a Call with Donna</span>
          <span class="nav-item-external">↗</span>
        </a>
        <a class="nav-item" href="https://wix.to/yhlD1Hj" target="_blank">
          <span class="nav-item-text">Book Extra Hour</span>
          <span class="nav-item-external">↗</span>
        </a>
        <a class="nav-item" href="https://www.risingandthriving.com/fierce-financials-3-0" target="_blank">
          <span class="nav-item-text">Learn More</span>
          <span class="nav-item-external">↗</span>
        </a>
      `);
      
      // COLLECTIVE
      html += buildSection('collective', '👥', 'Collective & Community', `
        <a class="nav-item" href="https://www.risingandthriving.com/group-page/the-money-mastery-collective" target="_blank">
          <span class="nav-item-text">Money Mastery Collective</span>
          <span class="nav-item-external">↗</span>
        </a>
        <a class="nav-item" href="https://fera.review/erps3" target="_blank">
          <span class="nav-item-text">Leave a Review</span>
          <span class="nav-item-external">↗</span>
        </a>
      `);
      
      // TUTORIALS
      html += buildSection('demos', '🎓', 'Tutorials & Demos', `
        <div class="nav-item placeholder"><span class="nav-item-text">Main Demo</span></div>
        <div class="nav-item placeholder"><span class="nav-item-text">Money Mastery Hub</span></div>
        <div class="nav-item placeholder"><span class="nav-item-text">Account Upload</span></div>
        <div class="nav-item placeholder"><span class="nav-item-text">Cash Tracking</span></div>
        <div class="nav-item placeholder"><span class="nav-item-text">Debt Dashboard</span></div>
        <div class="nav-item placeholder"><span class="nav-item-text">Personal System</span></div>
        <div class="nav-item placeholder"><span class="nav-item-text">Business System</span></div>
        <div class="nav-item placeholder"><span class="nav-item-text">Net Worth Planning</span></div>
      `);
      
      // SUPPORT
      html += buildSection('support', '📋', 'Support & Legal', `
        <a class="nav-item" href="https://wix.to/crzjWfQ" target="_blank">
          <span class="nav-item-text">Onboarding Call</span>
          <span class="nav-item-external">↗</span>
        </a>
        <a class="nav-item" href="https://www.wixforms.com/f/7420340074526540850" target="_blank">
          <span class="nav-item-text">Support Form</span>
          <span class="nav-item-external">↗</span>
        </a>
        <a class="nav-item" href="https://risingandthriving.com/mm-privacy" target="_blank">
          <span class="nav-item-text">Privacy Policy</span>
          <span class="nav-item-external">↗</span>
        </a>
        <a class="nav-item" href="https://risingandthriving.com/mm-terms" target="_blank">
          <span class="nav-item-text">Terms of Service</span>
          <span class="nav-item-external">↗</span>
        </a>
        <a class="nav-item" href="https://risingandthriving.com/mm-eula" target="_blank">
          <span class="nav-item-text">EULA</span>
          <span class="nav-item-external">↗</span>
        </a>
      `);
      
      content.innerHTML = html;
    }
    
    function buildSection(id, icon, title, content) {
      const isExpanded = navState.expandedSections.includes(id);
      return `
        <div class="nav-section ${isExpanded ? 'expanded' : ''}" id="section-${id}">
          <div class="nav-section-header" onclick="toggleSection('${id}')">
            <div class="nav-section-title">
              <span class="nav-section-icon">${icon}</span>
              ${title}
            </div>
            <span class="nav-section-arrow">▼</span>
          </div>
          <div class="nav-section-content">
            ${content}
          </div>
        </div>
      `;
    }
    
    function toggleSection(id) {
      const section = document.getElementById('section-' + id);
      const idx = navState.expandedSections.indexOf(id);
      
      if (idx > -1) {
        navState.expandedSections.splice(idx, 1);
        section.classList.remove('expanded');
      } else {
        navState.expandedSections.push(id);
        section.classList.add('expanded');
      }
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // LOADING OVERLAY
    // ═══════════════════════════════════════════════════════════════════
    function showLoading(title, subtitle) {
      document.getElementById('loadingTitle').textContent = title || 'Opening...';
      document.getElementById('loadingSubtitle').textContent = subtitle || 'Please wait';
      document.getElementById('loadingOverlay').classList.add('active');
    }
    
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // ACTIONS
    // ═══════════════════════════════════════════════════════════════════
    function navigateToSheet(sheetName) {
      google.script.run
        .withFailureHandler(function(error) {
          alert('Could not navigate to ' + sheetName);
        })
        .navigateToSheet(sheetName);
    }
    
    function openCategorization(accountName, buttonEl) {
      // Show loading immediately (instant feedback)
      showLoading('Opening Categorization...', accountName);
      
      // Also show button loading state if button element provided
      if (buttonEl) {
        buttonEl.classList.add('loading');
        buttonEl.textContent = '';
      }
      
      google.script.run
        .withSuccessHandler(function() {
          // Modal opened successfully - hide loading and reset button
          hideLoading();
          if (buttonEl) {
            buttonEl.classList.remove('loading');
            buttonEl.textContent = 'Categorize';
          }
        })
        .withFailureHandler(function(error) {
          hideLoading();
          if (buttonEl) {
            buttonEl.classList.remove('loading');
            buttonEl.textContent = 'Categorize';
          }
          alert('Could not open categorization for ' + accountName + ': ' + error.message);
        })
        .openCategorizationForAccount(accountName);
    }
    
    // ═══════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', loadAccounts);
  </script>
</body>
</html>
